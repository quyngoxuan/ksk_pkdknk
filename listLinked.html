<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Danh sách hồ sơ đã liên thông</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
    <link href="menu.css" rel="stylesheet" />
    <style>
      body { background: #f4f7f6; }
      .shell { max-width: 1440px; }
      .hero { background: linear-gradient(135deg, #064b33, #158154); color: #fff; }
      .card { border: 0; box-shadow: 0 .2rem 1.2rem rgba(18,65,45,.08); }
      .table-wrap { max-height: 650px; overflow: auto; }
      .filters { display:flex; flex-wrap:wrap; gap:.5rem; align-items:center; }
      .filters .form-control, .filters .form-select { width:260px; }
    </style>
  </head>
  <body>
    <div data-app-menu="linked-records"></div>
    <header class="hero py-3 mb-4"><div class="container shell"><div class="small opacity-75">Liên thông HSSK</div><h1 class="h3 mb-0">Danh sách hồ sơ đã liên thông</h1></div></header>
    <main class="container shell pb-5">
      <section class="card"><div class="card-body p-md-4">
        <div class="filters mb-3">
          <select id="company" class="form-select"><option value="">Tất cả đơn vị</option></select>
          <select id="campaign" class="form-select" disabled><option value="">Chọn đơn vị trước</option></select>
          <input id="q" class="form-control" placeholder="Mã HS, họ tên hoặc CCCD" />
          <button id="filter" class="btn btn-success"><i class="bi bi-funnel"></i> Lọc</button>
        </div>
        <div id="message" class="small text-secondary mb-3">Chọn điều kiện rồi bấm Lọc.</div>
        <div class="table-wrap border rounded"><table class="table table-hover table-sm mb-0">
          <thead class="table-success sticky-top"><tr><th>Mã HS</th><th>Họ và tên</th><th>Ngày sinh</th><th>Đợt khám</th><th>Ngày khám</th><th>Thời điểm liên thông</th><th>Mã giao dịch</th><th></th></tr></thead>
          <tbody id="rows"><tr><td colspan="8" class="text-center text-secondary py-4">Chưa tải dữ liệu.</td></tr></tbody>
        </table></div>
      </div></section>
    </main>
    <script src="menu-loader.js"></script>
    <script>
      const API = `${location.protocol === 'http:' ? location.origin : 'http://localhost:5500'}/api/v1`;
      const company = document.querySelector('#company'), campaign = document.querySelector('#campaign'), rows = document.querySelector('#rows'), message = document.querySelector('#message');
      let companies = [];
      const esc = value => String(value ?? '').replace(/[&<>'"]/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#039;','"':'&quot;'}[char]));
      const date = value => value ? new Intl.DateTimeFormat('vi-VN', { dateStyle:'short', timeStyle: value.includes?.('T') ? 'short' : undefined }).format(new Date(value)) : '';
      async function request(path) { const r = await fetch(`${API}${path}`); const data = await r.json(); if (!r.ok) throw new Error(data.detail || `Lỗi API (${r.status})`); return data; }
      async function loadCompanies() {
        companies = await request('/companies?limit=500');
        company.innerHTML = '<option value="">Tất cả đơn vị</option>' + companies.filter(x => x.mst).map(x => `<option value="${esc(x.company_id)}">${esc(x.name)} — MST: ${esc(x.mst)}</option>`).join('');
      }
      async function loadCampaigns() {
        campaign.disabled = true; campaign.innerHTML = '<option value="">Tất cả đợt khám</option>';
        if (!company.value) return;
        const data = await request(`/exam-campaigns?company_id=${encodeURIComponent(company.value)}`);
        campaign.innerHTML = '<option value="">Tất cả đợt khám</option>' + data.map(x => `<option value="${x.campaign_id}">${esc(x.campaign_name)}</option>`).join('');
        campaign.disabled = false;
      }
      async function loadRows() {
        const params = new URLSearchParams({ limit:'500' });
        if (company.value) params.set('company_id', company.value);
        if (campaign.value) params.set('campaign_id', campaign.value);
        if (document.querySelector('#q').value.trim()) params.set('q', document.querySelector('#q').value.trim());
        message.textContent = 'Đang tải dữ liệu…';
        try {
          const data = await request(`/lien-thong/exams/linked?${params}`);
          message.textContent = `Hiển thị ${data.length} hồ sơ đã liên thông thành công.`;
          rows.innerHTML = data.length ? data.map(x => {
            const query = new URLSearchParams({ PatientId:x.patient_id, ExamId:x.exam_id, MST:x.mst || '', CampaignId:x.campaign_id || '' });
            return `<tr><td class="fw-semibold">${esc(x.exam_code)}</td><td><a class="link-success fw-semibold text-decoration-none" href="ksk-tu-du-18.html?${query}">${esc(x.patient_name)}</a></td><td>${date(x.date_of_birth)}</td><td>${esc(x.campaign_name)}</td><td>${date(x.exam_date)}</td><td>${date(x.lien_thong_at)}</td><td>${esc(x.transaction_code || x.message_id)}</td><td><button class="btn btn-sm btn-outline-secondary" onclick="historyDialog(${x.exam_id})"><i class="bi bi-clock-history"></i> Nhật ký</button></td></tr>`;
          }).join('') : '<tr><td colspan="8" class="text-center text-secondary py-4">Chưa có hồ sơ liên thông phù hợp.</td></tr>';
        } catch (e) { message.innerHTML = `<span class="text-danger">${esc(e.message)}</span>`; }
      }
      async function historyDialog(id) {
        try { const data = await request(`/lien-thong/exams/${id}/history`); alert(data.length ? data.map(x => `${x.created_at}: ${x.status}${x.transaction_code ? ` — ${x.transaction_code}` : ''}${x.last_error ? `\n${x.last_error}` : ''}`).join('\n\n') : 'Chưa có nhật ký.'); }
        catch (e) { alert(e.message); }
      }
      window.historyDialog = historyDialog;
      company.addEventListener('change', loadCampaigns); document.querySelector('#filter').addEventListener('click', loadRows); document.querySelector('#q').addEventListener('keydown', e => { if (e.key === 'Enter') loadRows(); });
      loadCompanies().catch(e => message.innerHTML = `<span class="text-danger">${esc(e.message)}</span>`);
    </script>
  </body>
</html>
