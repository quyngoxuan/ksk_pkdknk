<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Danh sách đơn vị</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"><link href="menu.css" rel="stylesheet"><style>body{background:#f4f7f6}.shell{max-width:1200px}.hero{background:linear-gradient(135deg,#064b33,#158154);color:#fff}.card{border:0;box-shadow:0 .2rem 1.2rem rgba(18,65,45,.08)}.table-wrap{max-height:650px;overflow:auto}th{white-space:nowrap}</style></head>
<body><nav class="navbar navbar-expand bg-white border-bottom shadow-sm mb-4" aria-label="Điều hướng chính"><div class="container-fluid shell py-2"><div class="app-menu"><a href="main.html"><i class="bi bi-house-door"></i>Trang chính</a><a href="import.html"><i class="bi bi-file-earmark-arrow-up"></i>Nhập Excel</a><a href="list.html"><i class="bi bi-people"></i>Danh sách hồ sơ</a><a class="active" href="listCompany.html"><i class="bi bi-buildings"></i>Đơn vị</a><a href="listCampaign.html"><i class="bi bi-calendar2-week"></i>Đợt khám</a><a href="http://192.168.1.250:5500/ksk-tu-du-18.html?SHS=0&amp;MST=0912345687&amp;CampaignId=10003"><i class="bi bi-clipboard2-plus"></i>Thêm HS KSK</a><a href="lienthong.html"><i class="bi bi-send-check"></i>Liên thông</a></div></div></nav><header class="hero py-4 mb-4"><div class="container shell d-flex align-items-center justify-content-between gap-3"><div><div class="small opacity-75">Khám sức khỏe · Quản trị danh mục</div><h1 class="h3 mb-0">Danh sách đơn vị</h1></div><a href="editCompany.html" class="btn btn-light">+ Thêm đơn vị</a></div></header><main class="container shell"><section class="card"><div class="card-body p-md-4"><div class="row g-2 mb-4"><div class="col-md-8"><input id="search" class="form-control" placeholder="Tìm theo tên đơn vị hoặc mã số thuế"></div><div class="col-md-auto"><button id="search-button" class="btn btn-success w-100">Tìm kiếm</button></div><div class="col-md-auto"><button id="reload-button" class="btn btn-outline-secondary w-100">Tải lại</button></div></div><div id="status" class="small text-secondary mb-3"></div><div class="table-wrap border rounded"><table class="table table-hover align-middle mb-0"><thead class="table-success sticky-top"><tr><th>ID</th><th>Tên đơn vị</th><th>Mã số thuế</th><th>Mô tả</th><th>Cập nhật</th><th></th></tr></thead><tbody id="companies"></tbody></table></div></div></section></main><script>
const API=`${location.protocol==='http:'?location.origin:'http://localhost:5500'}/api/v1`,el=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#039;','"':'&quot;'}[c]));
async function load(){const q=el('search').value.trim(),url=new URL(`${API}/companies`);url.searchParams.set('limit','500');if(q)url.searchParams.set('q',q);el('status').textContent='Đang tải…';try{const r=await fetch(url),data=await r.json();if(!r.ok)throw Error(data.detail||`Lỗi API (${r.status})`);el('status').textContent=`Có ${data.length} đơn vị.`;el('companies').innerHTML=data.length?data.map(x=>`<tr><td>${x.company_id}</td><td class="fw-semibold">${esc(x.name)}</td><td>${esc(x.mst)}</td><td>${esc(x.description)}</td><td>${x.updated_at||x.created_at||''}</td><td class="text-nowrap"><a class="btn btn-sm btn-outline-success" href="editCompany.html?id=${x.company_id}">Sửa</a> <button class="btn btn-sm btn-outline-danger" onclick="removeCompany(${x.company_id},'${esc(x.name).replace(/'/g,'&#039;')}')">Xóa</button></td></tr>`).join(''):'<tr><td colspan="6" class="text-center text-secondary py-4">Chưa có đơn vị.</td></tr>'}catch(e){el('status').innerHTML=`<span class="text-danger">Không tải được dữ liệu: ${esc(e.message)}</span>`}}async function removeCompany(id,name){if(!confirm(`Xóa đơn vị “${name}”?`))return;try{const r=await fetch(`${API}/companies/${id}`,{method:'DELETE'});if(!r.ok){const x=await r.json();throw Error(x.detail||`Lỗi API (${r.status})`)}load()}catch(e){alert(e.message)}}el('search-button').onclick=load;el('reload-button').onclick=()=>{el('search').value='';load()};el('search').onkeydown=e=>{if(e.key==='Enter')load()};load();
</script><script src="menu-loader.js"></script></body></html>
