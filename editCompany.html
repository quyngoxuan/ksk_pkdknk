<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Thêm/Sửa đơn vị</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><style>body{background:#f4f7f6}.shell{max-width:850px}.hero{background:linear-gradient(135deg,#064b33,#158154);color:#fff}.card{border:0;box-shadow:0 .2rem 1.2rem rgba(18,65,45,.08)}textarea{min-height:125px}</style></head>
<body><header class="hero py-4 mb-4"><div class="container shell d-flex align-items-center justify-content-between gap-3"><div><div class="small opacity-75">Khám sức khỏe · Quản trị danh mục</div><h1 id="title" class="h3 mb-0">Thêm đơn vị</h1></div><a href="listCompany.html" class="btn btn-light">← Danh sách</a></div></header><main class="container shell"><div id="message"></div><section class="card"><div class="card-body p-md-4"><form id="company-form"><div class="row g-3"><div class="col-12"><label class="form-label">Tên đơn vị <span class="text-danger">*</span></label><input id="name" class="form-control" maxlength="300" required autofocus></div><div class="col-md-6"><label class="form-label">Mã số thuế</label><input id="mst" class="form-control" maxlength="30"></div><div class="col-12"><label class="form-label">Mô tả</label><textarea id="description" class="form-control" maxlength="1000"></textarea></div></div><div class="mt-4 d-flex gap-2"><button id="save" class="btn btn-success" type="submit">Lưu thông tin</button><a href="listCompany.html" class="btn btn-outline-secondary">Hủy</a></div></form></div></section></main><script>
const API=`${location.protocol==='http:'?location.origin:'http://localhost:5500'}/api/v1`,id=new URLSearchParams(location.search).get('id'),el=x=>document.getElementById(x),message=(t,type='success')=>el('message').innerHTML=`<div class="alert alert-${type}">${t}</div>`;
async function request(path,opt={}){const r=await fetch(`${API}${path}`,{headers:{'Content-Type':'application/json'},...opt}),data=await r.json();if(!r.ok)throw Error(data.detail||`Lỗi API (${r.status})`);return data}async function init(){if(!id)return;el('title').textContent='Cập nhật đơn vị';try{const x=await request(`/companies/${id}`);el('name').value=x.name||'';el('mst').value=x.mst||'';el('description').value=x.description||''}catch(e){message(e.message,'danger')}}el('company-form').onsubmit=async e=>{e.preventDefault();const save=el('save');save.disabled=true;try{const x=await request(id?`/companies/${id}`:'/companies',{method:id?'PATCH':'POST',body:JSON.stringify({name:el('name').value.trim(),mst:el('mst').value.trim()||null,description:el('description').value.trim()||null})});message('Đã lưu thành công. Đang chuyển về danh sách…');setTimeout(()=>location.href='listCompany.html',700)}catch(e){message(e.message,'danger')}finally{save.disabled=false}};init();
</script><script src="menu-loader.js"></script></body></html>
